[package]
name = "soroban-multisig-timelock"
version = "0.1.0"
edition = "2021"
authors = ["OrderStream <healthdecoded77@gmail.com>"]
description = "Production-ready multi-signature treasury and streaming timelock smart contract in Rust with emergency veto controls and storage TTL management."
license = "MIT OR Apache-2.0"
repository = "https://github.com/OrderStream/soroban-multisig-timelock"
readme = "README.md"
keywords = ["stellar", "soroban", "multisig", "timelock", "treasury"]

[lib]
crate-type = ["rlib"]

[dependencies]
soroban-sdk = { version = "22.0.0", default-features = false }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
ed25519-dalek = "=2.2.0"

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
panic = "abort"

